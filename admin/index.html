<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Админ-панель — Статус Дела</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
:root{--bg:#000;--bg2:#030712;--surface:rgba(255,255,255,.03);--surface2:rgba(255,255,255,.05);--border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);--text:#fff;--text2:rgba(255,255,255,.6);--text3:rgba(255,255,255,.35);--accent:#6366f1;--accent2:#8b5cf6;--accent3:#a5b4fc;--green:#10b981;--green2:#6ee7b7;--red:#ef4444;--red2:#fca5a5;--yellow:#f59e0b;--yellow2:#fbbf24;--radius:12px;--radius2:16px;--font:'Inter',system-ui,-apple-system,sans-serif;--glow:rgba(99,102,241,.15)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::selection{background:rgba(99,102,241,.4)}

/* Login */
.login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:rgba(255,255,255,.03);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius2);padding:48px 40px;width:100%;max-width:400px;text-align:center;position:relative;overflow:hidden}
.login-box::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 40%,rgba(99,102,241,.08),transparent 50%);pointer-events:none}
.login-box h1{font-size:1.3rem;margin-bottom:8px;color:#fff;position:relative;font-weight:800}
.login-box p{color:var(--text3);font-size:.85rem;margin-bottom:24px;position:relative}
.login-input{width:100%;padding:12px 16px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;font-size:1rem;font-family:var(--font);color:#fff;margin-bottom:16px;position:relative;transition:border-color .3s,box-shadow .3s}
.login-input:focus{border-color:rgba(99,102,241,.4);outline:none;box-shadow:0 0 20px rgba(99,102,241,.1)}
.login-input::placeholder{color:var(--text3)}
.login-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:var(--font);position:relative;transition:all .3s;box-shadow:0 4px 20px rgba(99,102,241,.3)}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(99,102,241,.4)}
.login-btn:active{transform:translateY(0)}

/* Admin */
.admin{display:none;padding:20px;max-width:1200px;margin:0 auto}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.admin-header h1{font-size:1.2rem;color:#fff;font-weight:800}

/* Buttons */
.btn{padding:10px 20px;border:none;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .3s cubic-bezier(.4,0,.2,1);display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(99,102,241,.4)}
.btn-primary:active{transform:translateY(0)}
.btn-success{background:linear-gradient(135deg,var(--green),var(--green2));color:#000;font-weight:700}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(16,185,129,.3)}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red2);border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.25);border-color:rgba(239,68,68,.4)}
.btn-outline{background:var(--surface);color:var(--text2);border:1px solid var(--border2)}
.btn-outline:hover{border-color:rgba(99,102,241,.3);color:#fff;background:var(--surface2)}
.btn-sm{padding:6px 12px;font-size:.75rem}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px;flex-wrap:wrap}
.tab{padding:10px 16px;cursor:pointer;font-weight:600;font-size:.82rem;border:none;border-radius:10px;color:var(--text3);background:transparent;font-family:var(--font);transition:all .3s}
.tab.active{color:#fff;background:rgba(99,102,241,.15);box-shadow:0 0 15px rgba(99,102,241,.1)}
.tab:hover{color:#fff;background:rgba(255,255,255,.03)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;transition:all .3s}
.stat:hover{border-color:rgba(99,102,241,.15);transform:translateY(-2px)}
.stat-val{font-size:1.4rem;font-weight:900;background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-lbl{font-size:.72rem;color:var(--text3);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* Table */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:rgba(255,255,255,.03);padding:12px 14px;text-align:left;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.5px;font-size:.72rem}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text2)}
tr:hover{background:rgba(99,102,241,.03)}
tr:last-child td{border-bottom:none}

/* Badges */
.badge{padding:4px 10px;border-radius:100px;font-size:.7rem;font-weight:700;white-space:nowrap;letter-spacing:.3px}
.badge-new{background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--border)}
.badge-active{background:rgba(16,185,129,.1);color:var(--green2);border:1px solid rgba(16,185,129,.15)}
.badge-pending{background:rgba(245,158,11,.1);color:var(--yellow2);border:1px solid rgba(245,158,11,.15)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:2000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.on{display:flex}
.modal{background:rgba(10,14,26,.95);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius2);width:100%;max-width:700px;max-height:90vh;overflow-y:auto;padding:32px;position:relative;box-shadow:0 25px 50px -12px rgba(0,0,0,.6),0 0 60px rgba(99,102,241,.05)}
.modal-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text3);font-size:1rem;cursor:pointer;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:all .3s}
.modal-close:hover{color:#fff;background:rgba(255,255,255,.1);border-color:rgba(99,102,241,.3)}
.modal h2{font-size:1.1rem;font-weight:800;color:#fff;margin-bottom:24px}

/* Form Groups */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.72rem;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg textarea,.fg select{width:100%;padding:11px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;font-size:.88rem;font-family:var(--font);color:#fff;transition:border-color .3s,box-shadow .3s}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:rgba(99,102,241,.4);outline:none;box-shadow:0 0 20px rgba(99,102,241,.08)}
.fg input::placeholder,.fg textarea::placeholder{color:var(--text4)}
.fg textarea{height:70px;resize:vertical}
.fg select option{background:#0a0e1a;color:#fff}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

/* Doc Preview */
.doc-preview{background:#fff;color:#000;border-radius:var(--radius);padding:40px;margin:16px 0;font-family:'Times New Roman',serif;position:relative;min-height:400px}
.doc-header{text-align:center;margin-bottom:30px;border-bottom:2px solid #000;padding-bottom:20px}
.doc-header h2{font-size:1.1rem;margin-bottom:5px}
.doc-header p{font-size:.85rem;color:#333}
.doc-body{margin-bottom:30px;line-height:1.8;font-size:.95rem}
.doc-body p{margin-bottom:12px}
.doc-body .field{border-bottom:1px dotted #999;padding:2px 0;display:inline-block;min-width:200px}
.doc-footer{margin-top:40px;display:flex;justify-content:space-between;gap:40px}
.doc-sign{width:200px;text-align:center}
.doc-sign .line{border-top:1px solid #000;margin-top:40px;padding-top:5px;font-size:.8rem}
.stamp{position:absolute;bottom:60px;right:40px;width:120px;height:120px;border:3px solid #c62828;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;transform:rotate(-15deg);opacity:.7}
.stamp-text{font-size:.6rem;font-weight:700;color:#c62828;text-align:center;line-height:1.2}
.stamp-center{font-size:1.2rem;color:#c62828}

/* Doc Cards */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.doc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;cursor:pointer;transition:all .35s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.doc-card::before{content:'';position:absolute;inset:0;border-radius:var(--radius2);background:linear-gradient(135deg,rgba(99,102,241,.06),transparent);opacity:0;transition:opacity .35s;pointer-events:none}
.doc-card:hover{border-color:rgba(99,102,241,.2);transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.3),0 0 40px var(--glow)}
.doc-card:hover::before{opacity:1}
.doc-card-icon{font-size:2rem;margin-bottom:8px;position:relative;z-index:2}
.doc-card-name{font-weight:700;font-size:.9rem;color:#fff;margin-bottom:4px;position:relative;z-index:2}
.doc-card-desc{font-size:.78rem;color:var(--text3);line-height:1.4;position:relative;z-index:2}
.doc-card-cat{font-size:.65rem;color:var(--text4);margin-top:8px;position:relative;z-index:2;text-transform:uppercase;letter-spacing:.5px;font-weight:600}

/* Search */
.search-bar{display:flex;gap:10px;margin-bottom:16px}
.search-bar input{flex:1;padding:11px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;font-size:.88rem;font-family:var(--font);color:#fff;transition:border-color .3s,box-shadow .3s}
.search-bar input:focus{border-color:rgba(99,102,241,.4);outline:none;box-shadow:0 0 20px rgba(99,102,241,.08)}
.search-bar input::placeholder{color:var(--text3)}

/* Inline search/filter inputs */
#search-clients,#filter-status{padding:11px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;font-size:.88rem;font-family:var(--font);color:#fff;transition:border-color .3s,box-shadow .3s}
#search-clients:focus,#filter-status:focus{border-color:rgba(99,102,241,.4);outline:none;box-shadow:0 0 20px rgba(99,102,241,.08)}
#search-clients::placeholder{color:var(--text3)}
#filter-status option{background:#0a0e1a;color:#fff}

/* Responsive */
@media(max-width:768px){
  .fg-row{grid-template-columns:1fr}
  .doc-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .login-box{padding:32px 24px}
  .modal{padding:24px 20px}
  .doc-preview{padding:24px}
  .doc-footer{flex-direction:column;gap:20px}
  .doc-sign{width:100%}
}
@media(min-width:769px) and (max-width:1024px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .doc-grid{grid-template-columns:repeat(2,1fr)}
}
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login" id="login-screen">
    <div class="login-box">
      <div style="font-size:2.5rem;margin-bottom:12px">🔐</div>
      <h1>Админ-панель</h1>
      <p>Документы, клиенты, организации</p>
      <input type="password" id="login-pass" class="login-input" placeholder="Пароль" autofocus>
      <button id="login-btn" class="login-btn">Войти</button>
      <p style="margin-top:12px;font-size:.7rem;color:var(--text4)">Пароль: admin123</p>
    </div>
  </div>

  <!-- Admin -->
  <div class="admin" id="admin-panel">
    <div class="admin-header">
      <h1>📋 Админ-панель</h1>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline" onclick="exportAll()">📥 Экспорт</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="clients">👤 Клиенты</button>
      <button class="tab" data-tab="docs">📄 Документы</button>
      <button class="tab" data-tab="orgs">🏛️ Организации</button>
    </div>

    <!-- Clients Tab -->
    <div id="tab-clients">
      <div class="stats">
        <div class="stat"><div class="stat-val" id="s-total">0</div><div class="stat-lbl">Всего дел</div></div>
        <div class="stat"><div class="stat-val" id="s-active">0</div><div class="stat-lbl">В работе</div></div>
        <div class="stat"><div class="stat-val" id="s-done">0</div><div class="stat-lbl">Завершено</div></div>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <input type="text" id="search-clients" placeholder="Поиск..." style="flex:1;min-width:200px">
        <select id="filter-status">
          <option value="">Все статусы</option>
          <option value="new">Новое</option>
          <option value="docs_collect">Сбор документов</option>
          <option value="bank_check">Проверка банка</option>
          <option value="regulator">Регулятор</option>
          <option value="court">Суд</option>
          <option value="return_done">Возврат</option>
          <option value="blocked">Приостановлено</option>
        </select>
        <button class="btn btn-primary" onclick="openClientForm()">+ Новое дело</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>№ дела</th><th>ФИО</th><th>Телефон</th><th>Сумма</th><th>Статус</th><th>Действия</th></tr></thead>
          <tbody id="clients-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Documents Tab -->
    <div id="tab-docs" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="color:#fff;font-size:1rem;font-weight:800">Шаблоны документов</h3>
        <button class="btn btn-primary" onclick="openDocForm()">+ Создать шаблон</button>
      </div>
      <div id="doc-grid" class="doc-grid"></div>
    </div>

    <!-- Organizations Tab -->
    <div id="tab-orgs" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="color:#fff;font-size:1rem;font-weight:800">Организации-партнёры</h3>
        <button class="btn btn-primary" onclick="openOrgForm()">+ Добавить организацию</button>
      </div>
      <div id="org-grid" class="doc-grid"></div>
    </div>
  </div>

  <!-- Client Form Modal -->
  <div class="modal-overlay" id="client-modal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('client-modal')">✕</button>
      <h2 id="client-form-title">Новое дело</h2>
      <form id="client-form">
        <div class="fg-row">
          <div class="fg"><label>Номер дела</label><input id="f-caseNumber" required></div>
          <div class="fg"><label>Статус</label>
            <select id="f-status">
              <option value="new">Новое обращение</option>
              <option value="docs_collect">Сбор документов</option>
              <option value="docs_ready">Документы готовы</option>
              <option value="bank_check">Проверка банка</option>
              <option value="bank_review">Рассмотрение банком</option>
              <option value="regulator">Обращение в регулятор</option>
              <option value="court_prep">Подготовка иска</option>
              <option value="court">В суде</option>
              <option value="court_win">Решение суда</option>
              <option value="return_process">Возврат средств</option>
              <option value="return_done">Средства возвращены</option>
              <option value="partial_return">Частичный возврат</option>
              <option value="blocked">Приостановлено</option>
            </select>
          </div>
        </div>
        <div class="fg-row">
          <div class="fg"><label>Имя *</label><input id="f-firstName" required></div>
          <div class="fg"><label>Фамилия *</label><input id="f-lastName" required></div>
        </div>
        <div class="fg-row">
          <div class="fg"><label>Телефон *</label><input id="f-phone" required></div>
          <div class="fg"><label>ИИН</label><input id="f-iin" maxlength="12"></div>
        </div>
        <div class="fg-row">
          <div class="fg"><label>Город</label>
            <select id="f-city"><option>Алматы</option><option>Астана</option><option>Шымкент</option><option>Актобе</option><option>Караганда</option><option>Атырау</option><option>Павлодар</option><option>Семей</option></select>
          </div>
          <div class="fg"><label>Сумма (₸)</label><input id="f-amount" type="number"></div>
        </div>
        <div class="fg"><label>Платформа-мошенник</label><input id="f-platform"></div>
        <div class="fg"><label>Куратор</label>
          <select id="f-assignedTo"><option>Руслан Амиров С.</option><option>Козлов А.</option><option>Назарова Д.</option><option>Бекишев Т.</option></select>
        </div>
        <div class="fg"><label>Заметки</label><textarea id="f-notes"></textarea></div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal('client-modal')">Отмена</button>
          <button type="submit" class="btn btn-success">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Doc Form Modal -->
  <div class="modal-overlay" id="doc-modal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('doc-modal')">✕</button>
      <h2>Создать шаблон документа</h2>
      <form id="doc-form">
        <div class="fg-row">
          <div class="fg"><label>Название *</label><input id="df-name" required></div>
          <div class="fg"><label>Категория</label>
            <select id="df-category">
              <option value="police">Полиция</option>
              <option value="arrfr">АРРФР</option>
              <option value="nbk">НБ РК</option>
              <option value="court">Суд</option>
              <option value="contract">Договоры</option>
              <option value="other">Другое</option>
            </select>
          </div>
        </div>
        <div class="fg"><label>Иконка</label><input id="df-icon" value="📄" maxlength="4"></div>
        <div class="fg"><label>Описание</label><input id="df-desc"></div>
        <div class="fg"><label>Текст документа (HTML)</label><textarea id="df-content" style="height:150px" placeholder="<h2>ЗАЯВЛЕНИЕ</h2><p>В полицию...</p>"></textarea></div>
        <div class="fg"><label>Поля для заполнения (через запятую)</label><input id="df-fields" placeholder="ФИО, ИИН, Адрес, Телефон"></div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal('doc-modal')">Отмена</button>
          <button type="submit" class="btn btn-success">Создать</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Doc Preview Modal -->
  <div class="modal-overlay" id="preview-modal">
    <div class="modal" style="max-width:800px">
      <button class="modal-close" onclick="closeModal('preview-modal')">✕</button>
      <div style="display:flex;gap:10px;margin-bottom:16px">
        <button class="btn btn-primary" onclick="downloadPDF()">📥 Скачать PDF</button>
        <button class="btn btn-outline" onclick="closeModal('preview-modal')">Закрыть</button>
      </div>
      <div id="doc-preview-content"></div>
    </div>
  </div>

  <script>
  var CLIENTS=JSON.parse(localStorage.getItem('cs_clients')||'[]');
  var TEMPLATES=JSON.parse(localStorage.getItem('cs_templates')||'[]');
  var ORGS=JSON.parse(localStorage.getItem('cs_orgs')||'[]');
  var editingClientId=null;

  // Load defaults
  if(!TEMPLATES.length){
    fetch('../data/organizations.json').then(function(r){return r.json()}).then(function(d){
      TEMPLATES=d.documents||[];
      ORGS=d.organizations||[];
      localStorage.setItem('cs_templates',JSON.stringify(TEMPLATES));
      localStorage.setItem('cs_orgs',JSON.stringify(ORGS));
      renderDocs();renderOrgs();
    });
  }

  // Login
  document.getElementById('login-btn').addEventListener('click',function(){
    if(document.getElementById('login-pass').value==='admin123'){
      document.getElementById('login-screen').style.display='none';
      document.getElementById('admin-panel').style.display='block';
      renderAll();
    }else{alert('Неверный пароль')}
  });

  // Tabs
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click',function(){
      document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
      this.classList.add('active');
      var tab=this.dataset.tab;
      document.getElementById('tab-clients').style.display=tab==='clients'?'block':'none';
      document.getElementById('tab-docs').style.display=tab==='docs'?'block':'none';
      document.getElementById('tab-orgs').style.display=tab==='orgs'?'block':'none';
    });
  });

  function renderAll(){renderClients();renderDocs();renderOrgs();updateStats()}

  function updateStats(){
    var set=function(id,v){var e=document.getElementById(id);if(e)e.textContent=v};
    set('s-total',CLIENTS.length);
    set('s-active',CLIENTS.filter(function(c){return c.status!=='return_done'}).length);
    set('s-done',CLIENTS.filter(function(c){return c.status==='return_done'}).length);
  }

  function maskPhone(p){if(!p||p.length<7)return p;return p.substring(0,4)+'****'+p.substring(p.length-3)}

  function renderClients(){
    var search=(document.getElementById('search-clients').value||'').toLowerCase();
    var filter=document.getElementById('filter-status').value;
    var list=CLIENTS.filter(function(c){
      if(filter&&c.status!==filter)return false;
      if(!search)return true;
      return(c.caseNumber||'').toLowerCase().includes(search)||(c.firstName||'').toLowerCase().includes(search)||(c.lastName||'').toLowerCase().includes(search)||(c.phone||'').includes(search);
    });
    var tbody=document.getElementById('clients-tbody');
    tbody.innerHTML=list.map(function(c){
      return'<tr><td><strong>'+c.caseNumber+'</strong></td><td>'+c.firstName+' '+c.lastName+'</td><td>'+maskPhone(c.phone)+'</td><td>'+(c.amount?c.amount.toLocaleString('ru-RU')+' ₸':'—')+'</td><td><span class="badge badge-'+(c.status==='return_done'?'active':c.status==='blocked'?'pending':'new')+'">'+c.statusName+'</span></td><td><button class="btn btn-sm btn-outline" onclick="editClient('+c.id+')">✏️</button> <button class="btn btn-sm btn-danger" onclick="deleteClient('+c.id+')">🗑️</button> <button class="btn btn-sm btn-outline" onclick="generateDocForClient('+c.id+')">📄</button></td></tr>';
    }).join('');
  }

  function renderDocs(){
    var grid=document.getElementById('doc-grid');
    grid.innerHTML=TEMPLATES.map(function(d){
      return'<div class="doc-card" onclick="previewDoc(\''+d.id+'\')"><div class="doc-card-icon">'+d.icon+'</div><div class="doc-card-name">'+d.name+'</div><div class="doc-card-desc">'+d.description+'</div><div class="doc-card-cat">'+d.category+'</div></div>';
    }).join('');
  }

  function renderOrgs(){
    var grid=document.getElementById('org-grid');
    grid.innerHTML=ORGS.map(function(o){
      return'<div class="doc-card"><div class="doc-card-icon">'+o.icon+'</div><div class="doc-card-name">'+o.name+'</div><div class="doc-card-desc">'+o.fullName+'</div><div class="doc-card-cat">'+o.services.join(', ')+'</div></div>';
    }).join('');
  }

  function save(){localStorage.setItem('cs_clients',JSON.stringify(CLIENTS));localStorage.setItem('cs_templates',JSON.stringify(TEMPLATES));localStorage.setItem('cs_orgs',JSON.stringify(ORGS))}

  // Client CRUD
  function openClientForm(client){
    editingClientId=client?client.id:null;
    document.getElementById('client-form-title').textContent=client?'Редактирование':'Новое дело';
    document.getElementById('f-caseNumber').value=client?client.caseNumber:'MK-'+new Date().toISOString().slice(2,7).replace('-','')+'-'+String(CLIENTS.length+1).padStart(5,'0');
    document.getElementById('f-firstName').value=client?client.firstName:'';
    document.getElementById('f-lastName').value=client?client.lastName:'';
    document.getElementById('f-phone').value=client?client.phone:'';
    document.getElementById('f-iin').value=client?client.iin||'':'';
    document.getElementById('f-city').value=client?client.city:'Алматы';
    document.getElementById('f-amount').value=client?client.amount:'';
    document.getElementById('f-platform').value=client?client.platform:'';
    document.getElementById('f-assignedTo').value=client?client.assignedTo:'Руслан Амиров С.';
    document.getElementById('f-notes').value=client?client.notes||'':'';
    document.getElementById('f-status').value=client?client.status:'new';
    document.getElementById('client-modal').classList.add('on');
  }

  document.getElementById('client-form').addEventListener('submit',function(e){
    e.preventDefault();
    var statusNames={new:'Новое обращение',docs_collect:'Сбор документов',docs_ready:'Документы готовы',bank_check:'Проверка банка',bank_review:'Рассмотрение банком',regulator:'Обращение в регулятор',court_prep:'Подготовка иска',court:'В суде',court_win:'Решение суда',return_process:'Возврат средств',return_done:'Средства возвращены',partial_return:'Частичный возврат',blocked:'Приостановлено'};
    var st=document.getElementById('f-status').value;
    var data={caseNumber:document.getElementById('f-caseNumber').value,firstName:document.getElementById('f-firstName').value,lastName:document.getElementById('f-lastName').value,phone:document.getElementById('f-phone').value,iin:document.getElementById('f-iin').value,city:document.getElementById('f-city').value,amount:parseInt(document.getElementById('f-amount').value)||0,platform:document.getElementById('f-platform').value,assignedTo:document.getElementById('f-assignedTo').value,notes:document.getElementById('f-notes').value,status:st,statusName:statusNames[st],statusDescription:'',caseDate:new Date().toISOString().split('T')[0],lastUpdate:new Date().toISOString().split('T')[0],history:[]};
    if(editingClientId){var idx=CLIENTS.findIndex(function(c){return c.id===editingClientId});if(idx>=0)CLIENTS[idx]={...CLIENTS[idx],...data}}
    else{data.id=CLIENTS.length?Math.max.apply(null,CLIENTS.map(function(c){return c.id}))+1:1;CLIENTS.push(data)}
    save();closeModal('client-modal');renderClients();updateStats();
  });

  window.editClient=function(id){var c=CLIENTS.find(function(x){return x.id===id});if(c)openClientForm(c)};
  window.deleteClient=function(id){if(!confirm('Удалить дело?'))return;CLIENTS=CLIENTS.filter(function(c){return c.id!==id});save();renderClients();updateStats()};

  // Doc Template CRUD
  function openDocForm(){document.getElementById('doc-modal').classList.add('on')}
  document.getElementById('doc-form').addEventListener('submit',function(e){
    e.preventDefault();
    var tmpl={id:'custom_'+Date.now(),name:document.getElementById('df-name').value,category:document.getElementById('df-category').value,icon:document.getElementById('df-icon').value,description:document.getElementById('df-desc').value,content:document.getElementById('df-content').value,fields:document.getElementById('df-fields').value.split(',').map(function(f){return f.trim()}).filter(Boolean)};
    TEMPLATES.push(tmpl);save();renderDocs();closeModal('doc-modal');this.reset();
  });

  // Doc Preview & PDF
  var currentDoc=null;
  window.previewDoc=function(id){
    currentDoc=TEMPLATES.find(function(d){return d.id===id});
    if(!currentDoc)return;
    var content='<div class="doc-preview" id="pdf-content">';
    content+='<div class="doc-header"><h2>'+currentDoc.name+'</h2><p>Республика Казахстан</p></div>';
    content+='<div class="doc-body">';
    if(currentDoc.content){content+=currentDoc.content}
    else{content+='<p>Заявитель: <span class="field">&nbsp;</span></p><p>Адрес: <span class="field">&nbsp;</span></p><p>Телефон: <span class="field">&nbsp;</span></p><p><br></p><p>Описание: <span class="field">&nbsp;</span></p><p><br></p><p>Прошу принять меры в соответствии с действующим законодательством Республики Казахстан.</p>'}
    content+='</div>';
    content+='<div class="doc-footer"><div class="doc-sign"><div class="line">Подпись / Дата</div></div><div class="doc-sign"><div class="line">ФИО / Дата</div></div></div>';
    content+='<div class="stamp"><div class="stamp-text">ЮРИДИЧЕСКАЯ<br>КОМПАНИЯ</div><div class="stamp-center">★</div><div class="stamp-text">г. Алматы</div></div>';
    content+='</div>';
    document.getElementById('doc-preview-content').innerHTML=content;
    document.getElementById('preview-modal').classList.add('on');
  };

  window.generateDocForClient=function(id){
    var c=CLIENTS.find(function(x){return x.id===id});
    if(!c)return;
    currentDoc={name:'Заявление',content:'<p>Заявитель: <strong>'+c.firstName+' '+c.lastName+'</strong></p><p>Телефон: <strong>'+c.phone+'</strong></p><p>Город: <strong>'+c.city+'</strong></p><p>Сумма убытка: <strong>'+(c.amount?c.amount.toLocaleString('ru-RU')+' ₸':'—')+'</strong></p><p>Платформа: <strong>'+c.platform+'</strong></p><p><br></p><p>Прошу принять меры по возврату денежных средств и привлечению виновных лиц к ответственности.</p>'};
    previewDoc(null);
  };

  window.downloadPDF=function(){
    var element=document.getElementById('pdf-content');
    if(!element)return;
    html2pdf().set({margin:1,filename:(currentDoc?currentDoc.name:'document')+'.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(element).save();
  };

  // Org CRUD
  function openOrgForm(){alert('Функция добавления организации')}
  function closeModal(id){document.getElementById(id).classList.remove('on')}
  function exportAll(){var blob=new Blob([JSON.stringify({clients:CLIENTS,templates:TEMPLATES,orgs:ORGS},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}

  // Search
  document.getElementById('search-clients').addEventListener('input',renderClients);
  document.getElementById('filter-status').addEventListener('change',renderClients);

  // Init
  fetch('../data/organizations.json').then(function(r){return r.json()}).then(function(d){
    if(!TEMPLATES.length){TEMPLATES=d.documents||[];ORGS=d.organizations||[];save()}
  });
  </script>
</body>
</html>
