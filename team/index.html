<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Команда — Антифрод Центр Казахстан</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
body{background:#000;padding-bottom:70px}
.tm{max-width:1100px;margin:0 auto;padding:clamp(24px,5vw,48px) clamp(16px,4vw,20px)}
.tm h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:900;margin-bottom:8px;text-align:center;animation:fadeInUp .6s ease both}
.tm>p{color:var(--text3);text-align:center;margin-bottom:16px;font-size:.92rem;animation:fadeInUp .6s ease .1s both}
.tm-stats{display:flex;justify-content:center;gap:clamp(24px,5vw,48px);margin-bottom:40px;animation:fadeInUp .6s ease .15s both}
.tm-stat{text-align:center}
.tm-stat-v{font-size:clamp(1.2rem,3vw,1.6rem);font-weight:900;background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tm-stat-l{font-size:.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* Filter */
.tm-filter{display:flex;gap:6px;justify-content:center;margin-bottom:28px;flex-wrap:wrap;animation:fadeInUp .6s ease .2s both}
.tm-filter-btn{padding:8px 16px;border-radius:100px;font-size:.75rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--text3);font-family:var(--font);transition:all .3s}
.tm-filter-btn:hover{border-color:rgba(99,102,241,.2);color:#fff}
.tm-filter-btn.active{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.3);color:var(--accent3)}

/* Team grid */
.tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tm-card{position:relative;border-radius:var(--radius);overflow:hidden;transition:all .35s;animation:fadeInUp .4s ease both}
.tm-card::before{content:'';position:absolute;inset:-1px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.05));opacity:0;transition:opacity .35s;z-index:0}
.tm-card:hover::before{opacity:1}
.tm-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.tm-card-inner{position:relative;z-index:1;background:rgba(6,6,12,.9);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px;text-align:center;transition:border-color .3s;height:100%}
.tm-card:hover .tm-card-inner{border-color:rgba(99,102,241,.15)}
.tm-avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;position:relative;overflow:hidden}
.tm-avatar img{width:100%;height:100%;object-fit:cover}
.tm-avatar-ring{position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(99,102,241,.2);animation:rotate 8s linear infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
.tm-name{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:2px}
.tm-role{font-size:.68rem;color:var(--accent3);font-weight:600;margin-bottom:8px}
.tm-tags{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-bottom:8px}
.tm-tag{padding:2px 8px;border-radius:100px;font-size:.58rem;font-weight:600;background:rgba(255,255,255,.04);color:var(--text3);border:1px solid rgba(255,255,255,.05)}
.tm-exp{font-size:.65rem;color:var(--text4)}

/* CTA */
.tm-cta{margin-top:48px;text-align:center;animation:fadeInUp .6s ease .3s both}
  </style>
</head>
<body>
  <div id="nav-container" data-page="team"></div>
  <div class="tm">
    <h1>👨‍⚖️ Наша команда</h1>
    <p>Лицензированные юристы и специалисты с опытом работы по финансовому мошенничеству</p>

    <div class="tm-stats">
      <div class="tm-stat"><div class="tm-stat-v">32</div><div class="tm-stat-l">Специалиста</div></div>
      <div class="tm-stat"><div class="tm-stat-v">10+</div><div class="tm-stat-l">Лет опыта</div></div>
      <div class="tm-stat"><div class="tm-stat-v">87%</div><div class="tm-stat-l">Успешных дел</div></div>
      <div class="tm-stat"><div class="tm-stat-v">12+</div><div class="tm-stat-l">Юрисдикций</div></div>
    </div>

    <div class="tm-filter">
      <button class="tm-filter-btn active" onclick="filterTeam('all')">Все</button>
      <button class="tm-filter-btn" onclick="filterTeam('lead')">Руководство</button>
      <button class="tm-filter-btn" onclick="filterTeam('lawyer')">Юристы</button>
      <button class="tm-filter-btn" onclick="filterTeam('crypto')">Крипто</button>
      <button class="tm-filter-btn" onclick="filterTeam('bank')">Банки</button>
      <button class="tm-filter-btn" onclick="filterTeam('analytics')">Аналитика</button>
    </div>

    <div class="tm-grid" id="tm-grid"></div>

    <div class="tm-cta">
      <div class="cta-box"><div class="cta-box-inner">
        <h3>Нужна консультация?</h3>
        <p>Бесплатная 30-минутная консультация с юристом</p>
        <a href="/rekvizit-check/contacts/" class="btn btn-fill">📝 Записаться на консультацию</a>
      </div></div>
    </div>
  </div>
  <footer class="ftr"><p>© 2026 Антифрод Центр Казахстан</p></footer>
  <script src="../assets/js/nav.js"></script>
  <script>

    {name:'Алексей Козлов',role:'Юрист · Банковское право',cat:'bank',specs:['Чарджбэк','Банковские споры','НБ РК'],exp:'9+ лет',cases:'650+',gender:'m'},
    {name:'Айгуль Бекишева',role:'Юрист · Recovery Scam',cat:'lawyer',specs:['Recovery Scam','Пирамиды','Полиция'],exp:'7+ лет',cases:'500+',gender:'f'},

    {name:'Ольга Соколова',role:'Юрист · АРРФР',cat:'lawyer',specs:['АРРФР','Лицензии','Предупреждения'],exp:'7+ лет',cases:'450+',gender:'f'},
    {name:'Артём Новиков',role:'Техспециалист · Блокчейн',cat:'crypto',specs:['Трекинг','Кошельки','DeFi'],exp:'6+ лет',cases:'380+',gender:'m'},

    {name:'Андрей Сидоров',role:'Техспециалист · Крипто',cat:'crypto',specs:['Ethereum','BSC','TRON'],exp:'5+ лет',cases:'320+',gender:'m'},
    {name:'Виктория Лазарева',role:'Юрист · Банки',cat:'bank',specs:['Чарджбэк','Оспаривание','Рекламации'],exp:'7+ лет',cases:'470+',gender:'f'},

    {name:'Екатерина Орлова',role:'Аналитик · Отчёты',cat:'analytics',specs:['Отчёты','Статистика','Анализ'],exp:'4+ лет',cases:'250+',gender:'f'},
    {name:'Пётр Зайцев',role:'Юрист · Киберпреступность',cat:'lawyer',specs:['Киберполиция','Мошенничество','Расследования'],exp:'11+ лет',cases:'780+',gender:'m'},
    {name:'Алина Романова',role:'Юрист · АРРФР',cat:'lawyer',specs:['АРРФР','Лицензии','Жалобы'],exp:'6+ лет',cases:'420+',gender:'f'},
    {name:'Владислав Козлов',role:'Техспециалист · OSINT',cat:'analytics',specs:['OSINT','Следы','Идентификация'],exp:'5+ лет',cases:'310+',gender:'m'},

    {name:'Никита Волков',role:'Юрист · Суд',cat:'lawyer',specs:['Иски','Суд','Исполнение'],exp:'8+ лет',cases:'580+',gender:'m'},
    {name:'Валерия Попова',role:'Аналитик · Крипто',cat:'analytics',specs:['Транзакции','Анализ','Отчёты'],exp:'4+ лет',cases:'270+',gender:'f'},
    {name:'Михаил Лебедев',role:'Юрист · Регуляторы',cat:'lawyer',specs:['Международные','Регуляторы','Лицензии'],exp:'10+ лет',cases:'720+',gender:'m'}
  ];

  function getInitials(name){return name.split(' ').map(function(n){return n[0]}).join('')}
  function getAvatarColor(name){var colors=['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#a855f7'];var hash=0;for(var i=0;i<name.length;i++)hash=name.charCodeAt(i)+((hash<<5)-hash);return colors[Math.abs(hash)%colors.length]}
  function getGenderEmoji(g){return g==='f'?'👩‍⚖️':'👨‍⚖️'}

  function renderTeam(filter){
    var list=filter==='all'?team:team.filter(function(t){return t.cat===filter});
    document.getElementById('tm-grid').innerHTML=list.map(function(t,i){
      var color=getAvatarColor(t.name);
      var initials=getInitials(t.name);
      return'<div class="tm-card" style="animation-delay:'+(i*.03)+'s"><div class="tm-card-inner"><div class="tm-avatar"><div class="tm-avatar-ring"></div><div style="width:100%;height:100%;background:linear-gradient(135deg,'+color+','+color+'88);display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:1.5rem">'+getGenderEmoji(t.gender)+'</div></div><div class="tm-name">'+t.name+'</div><div class="tm-role">'+t.role+'</div><div class="tm-tags">'+t.specs.map(function(s){return'<span class="tm-tag">'+s+'</span>'}).join('')+'</div><div class="tm-exp">'+t.exp+' · '+t.cases+' дел</div></div></div>';
    }).join('');
  }

  function filterTeam(cat){
    document.querySelectorAll('.tm-filter-btn').forEach(function(b){b.classList.remove('active')});
    event.target.classList.add('active');
    renderTeam(cat);
  }

  renderTeam('all');
  </script>
</body>
</html>
