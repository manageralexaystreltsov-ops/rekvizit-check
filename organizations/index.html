<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Реестр организаций — GlobalSafe Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
body{background:#000;padding-bottom:70px}
.og{max-width:1000px;margin:0 auto;padding:clamp(20px,4vw,32px) clamp(16px,4vw,16px)}
.og h1{font-size:clamp(1.4rem,4vw,1.8rem);font-weight:900;margin-bottom:6px;letter-spacing:-.02em}
.og>p{color:var(--text3);margin-bottom:24px;font-size:.88rem;line-height:1.6}
.cat-section{margin-bottom:32px}
.cat-title{font-size:.95rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px;color:#fff}
.cat-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.org-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.org-card{position:relative;border-radius:var(--radius);overflow:hidden;transition:all .35s}
.org-card::before{content:'';position:absolute;inset:-1px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(139,92,246,.06));opacity:0;transition:opacity .35s;z-index:0}
.org-card:hover::before{opacity:1}
.org-card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.25)}
.org-card-inner{position:relative;z-index:1;background:rgba(6,6,12,.9);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:border-color .3s}
.org-card:hover .org-card-inner{border-color:rgba(99,102,241,.15)}
.org-name{font-weight:700;font-size:.9rem;color:#fff;margin-bottom:4px}
.org-full{font-size:.72rem;color:var(--text3);margin-bottom:8px;line-height:1.4}
.org-phone-big{font-size:1.1rem;font-weight:800;color:var(--accent3);margin-bottom:6px;letter-spacing:1px}
.org-when{font-size:.68rem;color:var(--text2);line-height:1.5;margin-bottom:8px;padding:8px 10px;background:rgba(99,102,241,.04);border-radius:6px;border-left:2px solid rgba(99,102,241,.3)}
.org-btns{display:flex;gap:6px;flex-wrap:wrap}
.org-btn{padding:7px 14px;border-radius:8px;font-size:.68rem;font-weight:600;text-decoration:none;transition:all .25s;display:inline-flex;align-items:center;gap:5px}
.btn-contact{background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.15);color:var(--accent3)}
.btn-contact:hover{background:rgba(99,102,241,.15);color:#fff;text-decoration:none}
.btn-site{background:rgba(255,255,255,.025);border:1px solid var(--border);color:var(--text2)}
.btn-site:hover{background:rgba(255,255,255,.05);color:#fff;text-decoration:none}
.btn-info{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.12);color:var(--green2)}
.btn-info:hover{background:rgba(16,185,129,.12);color:#fff;text-decoration:none}
.search-org{margin-bottom:20px;position:relative}
.search-org::before{content:'';position:absolute;inset:-1px;border-radius:12px;background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.05));z-index:0}
.search-org input{width:100%;padding:12px 16px;background:rgba(6,6,12,.95);border:1px solid var(--border);border-radius:11px;font-size:.88rem;font-family:var(--font);color:#fff;position:relative;z-index:1;transition:all .3s}
.search-org input::placeholder{color:var(--text4)}
.search-org input:focus{border-color:rgba(99,102,241,.35);outline:none;box-shadow:0 0 20px rgba(99,102,241,.08)}

/* === BOT SECTION === */
.bot-section{margin-bottom:32px;position:relative;border-radius:var(--radius2);overflow:hidden}
.bot-section::before{content:'';position:absolute;inset:-1px;border-radius:var(--radius2);background:linear-gradient(135deg,rgba(16,185,129,.2),rgba(99,102,241,.1));z-index:0}
.bot-inner{position:relative;z-index:1;background:rgba(6,6,12,.95);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:var(--radius2);padding:24px}
.bot-title{font-size:1.1rem;font-weight:800;color:#fff;margin-bottom:4px}
.bot-sub{font-size:.82rem;color:var(--text3);margin-bottom:16px}
.bot-questions{display:grid;gap:8px}
.bot-q{padding:12px 16px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .3s;font-size:.85rem;color:var(--text2);text-align:left;font-family:var(--font);width:100%}
.bot-q:hover{border-color:rgba(16,185,129,.2);background:rgba(16,185,129,.04);color:#fff}
.bot-q .q-icon{margin-right:8px}
.bot-answer{display:none;margin-top:12px;padding:16px;background:rgba(16,185,129,.04);border:1px solid rgba(16,185,129,.1);border-radius:10px;font-size:.82rem;color:var(--text2);line-height:1.7}
.bot-answer h4{color:var(--green2);font-size:.88rem;margin-bottom:8px}
.bot-answer ul{margin:8px 0;padding-left:18px}
.bot-answer li{margin-bottom:4px}
.bot-answer a{color:var(--accent3)}

/* === MODAL === */
.om{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:2000;align-items:flex-end;justify-content:center;padding:0}
.om.on{display:flex}
.oml{position:relative;border-radius:var(--radius2) var(--radius2) 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;animation:mu .35s cubic-bezier(.4,0,.2,1)}
.oml::before{content:'';position:absolute;inset:-1px;border-radius:var(--radius2) var(--radius2) 0 0;background:linear-gradient(135deg,rgba(99,102,241,.2),rgba(139,92,246,.1));z-index:-1}
@keyframes mu{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.oml-inner{background:rgba(6,6,12,.98);backdrop-filter:blur(32px);border-radius:var(--radius2) var(--radius2) 0 0;padding:24px 20px 32px;position:relative}
.omx{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text3);font-size:.85rem;cursor:pointer;padding:8px 10px;border-radius:8px;transition:all .2s;z-index:10}
.omx:hover{color:#fff;border-color:var(--border2)}
.oml h2{font-size:1.1rem;font-weight:800;color:#fff;margin-bottom:4px}
.oml .om-full{font-size:.78rem;color:var(--text3);margin-bottom:16px}
.om-section{margin-bottom:14px}
.om-section-title{font-size:.65rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.om-phone{font-size:1.3rem;font-weight:900;color:var(--accent3);letter-spacing:2px;margin-bottom:4px}
.om-email{font-size:.85rem;color:var(--accent3)}
.om-hours{font-size:.82rem;color:var(--text2)}
.om-when{font-size:.82rem;color:var(--text2);line-height:1.6;padding:12px;background:rgba(255,255,255,.02);border-radius:8px;border-left:3px solid rgba(99,102,241,.3)}
.om-say{font-size:.82rem;color:var(--text2);line-height:1.6;padding:12px;background:rgba(16,185,129,.04);border-radius:8px;border-left:3px solid rgba(16,185,129,.3);font-style:italic}
.om-docs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.om-doc{padding:3px 8px;background:rgba(255,255,255,.04);border-radius:4px;font-size:.68rem;color:var(--text3)}
.om-btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.om-btn{padding:10px 18px;border-radius:10px;font-size:.82rem;font-weight:600;text-decoration:none;transition:all .25s;display:inline-flex;align-items:center;gap:6px;flex:1;justify-content:center}
.om-btn-call{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.2)}
.om-btn-call:hover{box-shadow:0 6px 24px rgba(99,102,241,.3);color:#fff;text-decoration:none}
.om-btn-site{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text2)}
.om-btn-site:hover{background:rgba(255,255,255,.08);color:#fff;text-decoration:none}

@media(max-width:500px){.org-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="nav-container" data-page="organizations"></div>
  <div class="og">
    <h1>Реестр организаций</h1>
    <p>Куда обращаться при мошенничестве. Выберите проблему или найдите организацию.</p>

    <!-- BOT SECTION -->
    <div class="bot-section">
      <div class="bot-inner">
        <div class="bot-title">🤖 Бот-помощник</div>
        <div class="bot-sub">Опишите вашу проблему — подскажем, куда обратиться</div>
        <div class="bot-questions" id="bot-questions"></div>
        <div class="bot-answer" id="bot-answer"></div>
      </div>
    </div>

    <div class="search-org"><input type="text" id="orgSearch" placeholder="Поиск организации..."></div>
    <div id="orgList"></div>
  </div>

  <!-- MODAL -->
  <div class="om" id="om"><div class="oml"><div class="oml-inner">
    <button class="omx" onclick="document.getElementById('om').classList.remove('on')">✕</button>
    <div id="om-content"></div>
  </div></div></div>

  <footer class="ftr"><p>© 2026 GlobalSafe Finance</p></footer>
  <script src="../assets/js/nav.js"></script>
  <script>
  var orgs=[],cats=[];
  fetch('../data/organizations.json').then(function(r){return r.json()}).then(function(d){
    cats=d.categories||[];orgs=d.organizations||[];renderOrgs(orgs);initBot();
  });

  function renderOrgs(list){
    var g={};list.forEach(function(o){if(!g[o.cat])g[o.cat]=[];g[o.cat].push(o)});
    var h='';cats.forEach(function(c){
      var items=g[c.id];if(!items||!items.length)return;
      h+='<div class="cat-section"><div class="cat-title">'+c.icon+' '+c.name+'</div><div class="org-grid">';
      items.forEach(function(o){
        h+='<div class="org-card"><div class="org-card-inner">';
        h+='<div class="org-name">'+o.name+'</div>';
        h+='<div class="org-full">'+o.full+'</div>';
        if(o.phone)h+='<div class="org-phone-big">📞 '+o.phone+'</div>';
        if(o.when)h+='<div class="org-when">'+o.when+'</div>';
        h+='<div class="org-btns">';
        if(o.phone)h+='<a href="tel:'+o.phone.replace(/\s/g,'')+'" class="org-btn btn-contact">📞 Позвонить</a>';
        if(o.site)h+='<a href="https://'+o.site+'" target="_blank" class="org-btn btn-site">🌐 Сайт</a>';
        h+='<button class="org-btn btn-info" onclick="showOrg(\''+o.id+'\')">ℹ️ Подробнее</button>';
        h+='</div></div></div>';
      });
      h+='</div></div>';
    });
    document.getElementById('orgList').innerHTML=h||'<div class="empt"><div class="empt-i">🔍</div><p>Не найдено</p></div>';
  }

  function showOrg(id){
    var o=orgs.find(function(x){return x.id===id});if(!o)return;
    var h='<h2>'+o.name+'</h2><div class="om-full">'+o.full+'</div>';
    if(o.phone)h+='<div class="om-section"><div class="om-section-title">Телефон</div><div class="om-phone">'+o.phone+'</div></div>';
    if(o.email)h+='<div class="om-section"><div class="om-section-title">Email</div><div class="om-email">'+o.email+'</div></div>';
    if(o.address)h+='<div class="om-section"><div class="om-section-title">Адрес</div><div style="font-size:.82rem;color:var(--text2)">'+o.address+'</div></div>';
    if(o.hours)h+='<div class="om-section"><div class="om-section-title">Режим работы</div><div class="om-hours">'+o.hours+'</div></div>';
    if(o.when)h+='<div class="om-section"><div class="om-section-title">Когда обращаться</div><div class="om-when">'+o.when+'</div></div>';
    if(o.whatSay&&o.whatSay!=='—')h+='<div class="om-section"><div class="om-section-title">Что говорить при звонке</div><div class="om-say">«'+o.whatSay+'»</div></div>';
    if(o.docs&&o.docs[0]!=='—')h+='<div class="om-section"><div class="om-section-title">Какие документы нужны</div><div class="om-docs">'+o.docs.map(function(d){return'<span class="om-doc">'+d+'</span>'}).join('')+'</div></div>';
    h+='<div class="om-btns">';
    if(o.phone)h+='<a href="tel:'+o.phone.replace(/\s/g,'')+'" class="om-btn om-btn-call">📞 Позвонить</a>';
    if(o.site)h+='<a href="https://'+o.site+'" target="_blank" class="om-btn om-btn-site">🌐 Сайт</a>';
    h+='</div>';
    document.getElementById('om-content').innerHTML=h;
    document.getElementById('om').classList.add('on');
  }

  function initBot(){
    var problems=[
      {q:'Мошеннический брокер не выводит деньги',icon:'🏦',answer:'<h4>Куда обращаться:</h4><ul><li><strong>Банк</strong> — немедленно позвоните и инициируйте чарджбэк</li><li><a href="#" onclick="showOrg(\'arrfr\');return false">АРРФР (1434)</a> — жалоба на нелегальную деятельность</li><li><a href="#" onclick="showOrg(\'police\');return false">Полиция (102)</a> — заявление о мошенничестве</li></ul><p>⚠️ Действуйте в первые 72 часа!</p>'},
      {q:'Инвестиционная пирамида',icon:'🔺',answer:'<h4>Куда обращаться:</h4><ul><li><a href="#" onclick="showOrg(\'arrfr\');return false">АРРФР (1434)</a> — проверка и жалоба</li><li><a href="#" onclick="showOrg(\'police\');return false">Полиция (102)</a> — заявление</li><li><a href="#" onclick="showOrg(\'prosecutor\');return false">Прокуратура</a> — если полиция бездействует</li></ul>'},
      {q:'Банк блокирует карту / не выводит средства',icon:'💳',answer:'<h4>Куда обращаться:</h4><ul><li><strong>Горячая линия банка</strong> — уточните причину блокировки</li><li><a href="#" onclick="showOrg(\'nbk\');return false">НБ РК (8 800 080 45 36)</a> — жалоба на банк</li><li><a href="#" onclick="showOrg(\'sud\');return false">Суд</a> — если банк неправомерно блокирует</li></ul>'},
      {q:'Кибермошенничество / кража денег онлайн',icon:'💻',answer:'<h4>Куда обращаться:</h4><ul><li><a href="#" onclick="showOrg(\'police\');return false">Киберполиция (102)</a> — заявление</li><li><strong>Банк</strong> — блокировка карты и чарджбэк</li><li><a href="#" onclick="showOrg(\'arrfr\');return false">АРРФР (1434)</a> — если замешана финансовая организация</li></ul>'},
      {q:'Фейковая криптобиржа',icon:'₿',answer:'<h4>Куда обращаться:</h4><ul><li><strong>Банк</strong> — чарджбэк если оплата была картой</li><li><a href="#" onclick="showOrg(\'police\');return false">Полиция (102)</a> — заявление</li><li><a href="#" onclick="showOrg(\'etherscan\');return false">Etherscan/BSCScan</a> — отслеживание кошелька</li><li><a href="#" onclick="showOrg(\'arrfr\');return false">АРРФР (1434)</a></li></ul>'},
      {q:'Несанкционированное списание с карты',icon:'⚠️',answer:'<h4>Куда обращаться:</h4><ul><li><strong>Банк</strong> — немедленная блокировка и оспаривание</li><li><a href="#" onclick="showOrg(\'nbk\');return false">НБ РК</a> — жалоба если банк отказывает</li><li><a href="#" onclick="showOrg(\'police\');return false">Полиция (102)</a></li></ul>'}
    ];
    var bq=document.getElementById('bot-questions');
    bq.innerHTML=problems.map(function(p,i){
      return'<button class="bot-q" onclick="showAnswer('+i+')"><span class="q-icon">'+p.icon+'</span>'+p.q+'</button>';
    }).join('');
    window.showAnswer=function(i){
      var a=document.getElementById('bot-answer');
      a.innerHTML=problems[i].answer;
      a.style.display='block';
      a.scrollIntoView({behavior:'smooth',block:'nearest'});
    };
  }

  document.getElementById('orgSearch').addEventListener('input',function(){
    var q=this.value.toLowerCase();
    renderOrgs(orgs.filter(function(o){
      return o.name.toLowerCase().indexOf(q)>=0||o.full.toLowerCase().indexOf(q)>=0||(o.site&&o.site.toLowerCase().indexOf(q)>=0);
    }));
  });
  </script>
</body>
</html>
